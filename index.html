<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <title>Fitness Tracker</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Library Logger">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Fitness Tracker</h1>
    <div class="header-actions">
      <span id="sync-badge" class="sync-badge" hidden></span>
      <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">⚙</button>
    </div>
  </header>
  <nav id="tabbar" class="tabbar" aria-label="Main navigation"></nav>
  <main id="view" class="view"></main>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
